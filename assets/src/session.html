<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Statecraft: a real run</title>
<link rel="stylesheet" href="common.css">
<style>
  .term { left: 48px; top: 40px; width: 1184px; height: 640px; background: #0b0f14; overflow: hidden; }
  .bar { height: 40px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .bar span { flex: 1; text-align: center; font: 13px var(--mono); color: var(--muted); margin-right: 60px; }
  #log { padding: 18px 26px; font: 15px/24px var(--mono); white-space: pre; }
  .ln { display: block; min-height: 24px; }
  .p { color: var(--text); } .p b { color: var(--purple); }
  .dot { color: var(--green); } .dotp { color: var(--purple); } .dim { color: var(--muted); }
  .k { color: var(--blue); } .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }
  .hd { color: var(--text); font-weight: 700; }
  .spin { color: var(--amber); }
</style>
</head>
<body>
<div id="stage">
  <div class="card term">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>export-service · feature/export-worker</span></div>
    <div id="log"></div>
  </div>
</div>
<script src="common.js"></script>
<script>
const DURATION = 25000;
const PROMPT = 'statecraft: fix this branch';
// [html, appear-at ms, kind, until]; 'spin' lines disappear at `until`, when the next line replaces them.
const D = '<span class="dim">  ⎿  </span>';
const lines = [
  ['<span class="p"><b>&gt;</b> <span id="prompt"></span></span>', 0, 'prompt'],
  ['', 1700],
  ['<span class="dotp">⏺</span> Skill(<span class="k">statecraft:statecraft</span>)', 1800],
  [D + '<span class="dim">tree clean · gate: python3 -m unittest · export_status is public</span>', 2300],
  ['<span class="dotp">⏺</span> <b>statecraft-auditor-subagent</b> <span class="dim">Audit export-worker diff</span>', 3000],
  ['<span class="spin">  ✻ Reproducing failure, crash and race paths…</span>', 3400, 'spin', 5000],
  [D + '1 machine · <span class="warn">exports lifecycle in 7 columns</span> · <span class="bad">4 reachable bugs</span>', 5000],
  ['<span class="dotp">⏺</span> git switch -c <span class="k">statecraft/20261116-1116</span> <span class="dim">your branch stays untouched</span>', 5900],
  ['<span class="dotp">⏺</span> <b>statecraft-converter-subagent</b> <span class="dim">Convert exports lifecycle · own worktree</span>', 6700],
  [D + 'worktree started on origin/main <span class="dim">→</span> reset to base <span class="k">4c80207</span>', 7300],
  ['<span class="spin">  ✻ Pinning today\'s behaviour, then converting…</span>', 7900, 'spin', 9600],
  [D + '<span class="k">a040485</span> characterization tests <span class="dim">·</span> <span class="ok">pass on base</span>', 9600],
  [D + '<span class="k">6ad0aaa</span> explicit state machine <span class="dim">·</span> 8 bug tests <span class="bad">fail on base</span>, <span class="ok">pass now</span>', 10300],
  ['<span class="dotp">⏺</span> <b>statecraft-auditor-subagent</b> <span class="dim">Review the conversion · diff-review</span>', 11200],
  ['<span class="spin">  ✻ Reviewing against the convert rules…</span>', 11600, 'spin', 13000],
  [D + '<span class="bad">✗</span> rollout gap: a worker between the two upgrade steps could re-email', 13000],
  ['<span class="dotp">⏺</span> SendMessage <span class="dim">→ converter</span>', 13900],
  [D + '<span class="k">acb06c4</span> one atomic db.upgrade() · guarded claim', 14600],
  ['<span class="dot">⏺</span> Landed 3 commits · <span class="ok">44 tests OK</span> · worktree removed · nothing pushed', 15600],
  ['', 15900],
  ['  <span class="hd">Fixed</span>  retries never ran · mail error marked "failed" · stuck after a crash', 16200],
  ['         two workers could take one export', 16700],
  ['  <span class="hd">Kept</span>   export_status response shape · old columns still written', 17400],
  ['  <span class="hd">Asks</span>   6 decisions: retried failures now show "queued", rollout order…', 18100],
];$('#log').innerHTML = lines.map(([h]) => `<span class="ln">${h}</span>`).join('');

function render(t) {
  const els = $$('#log .ln');
  lines.forEach(([, at, kind, until], i) => {
    const el = els[i];
    const shown = t >= at && !(kind === 'spin' && t >= until);
    el.style.display = (kind === 'spin' && t >= until) ? 'none' : 'block';
    el.style.opacity = shown ? out3(prog(t, at, 250)) : 0;
    if (kind === 'spin' && shown) {
      const frames = ['✻', '✶', '✳', '✢', '·', '✢', '✳', '✶'];
      el.firstChild.textContent = el.firstChild.textContent.replace(/^ {2}./, '  ' + frames[Math.floor(t / 120) % frames.length]);
    }
  });
  const p = $('#prompt');
  const done = typed(p, PROMPT, t, 200, 22);
  p.innerHTML = p.textContent + (t < 1700 && Math.floor(t / 450) % 2 === 0 ? '<span style="background:#e6edf3">&nbsp;</span>' : '');
}
</script>
</body>
</html>
