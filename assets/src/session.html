<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Statecraft: a real run</title>
<link rel="stylesheet" href="common.css">
<style>
  .term { left: 48px; top: 40px; width: 1184px; height: 640px; background: #0b0f14; overflow: hidden; }
  .bar { height: 40px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .bar span { flex: 1; text-align: center; font: 13px var(--mono); color: var(--muted); margin-right: 60px; }
  #log { padding: 18px 26px; font: 15px/24px var(--mono); white-space: pre; }
  .ln { display: block; min-height: 24px; }
  .p { color: var(--text); } .p b { color: var(--purple); }
  .dot { color: var(--green); } .dotp { color: var(--purple); } .dim { color: var(--muted); }
  .k { color: var(--blue); } .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }
  .hd { color: var(--text); font-weight: 700; }
  .spin { color: var(--amber); }
</style>
</head>
<body>
<div id="stage">
  <div class="card term">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>export-service · feature/export-worker</span></div>
    <div id="log"></div>
  </div>
</div>
<script src="common.js"></script>
<script>
const DURATION = 27000;
const PROMPT = 'statecraft: fix this branch. I accept the visible changes the bug fixes need.';
// [html, appear-at ms, kind, until]; 'spin' lines disappear at `until`, when the next line replaces them.
const D = '<span class="dim">  ⎿  </span>';
const lines = [
  ['<span class="p"><b>&gt;</b> <span id="prompt"></span></span>', 0, 'prompt'],
  ['', 3600],
  ['<span class="dotp">⏺</span> Skill(<span class="k">statecraft:statecraft</span>)', 3700],
  [D + '<span class="dim">tree clean · gate passes on 5ace530 · .claude/worktrees/ excluded</span>', 4200],
  ['<span class="dotp">⏺</span> <b>statecraft-auditor-subagent</b> <span class="dim">Audit export-worker diff</span>', 4900],
  [D + '1 machine · <span class="warn">exports lifecycle in 7 columns</span> · <span class="bad">3 bugs to fix</span>', 5800],
  ['<span class="dotp">⏺</span> Approval: <b>6 changes callers will see</b> <span class="dim">· accepted in your request</span>', 6600],
  ['<span class="dotp">⏺</span> git worktree add <span class="k">.claude/worktrees/statecraft-20261116-1231</span>', 7400],
  ['<span class="dotp">⏺</span> <b>statecraft-converter-subagent</b> <span class="dim">Convert exports lifecycle · own worktree</span>', 8200],
  [D + 'reset its worktree to base <span class="k">5ace530</span>', 8700],
  ['<span class="spin">  ✻ Pinning today\'s behaviour, then converting…</span>', 9200, 'spin', 10800],
  [D + '<span class="k">4d80cb7</span> characterization tests <span class="dim">·</span> <span class="ok">pass on base</span>', 10800],
  [D + '<span class="k">51c2440</span> explicit state machine <span class="dim">·</span> bug tests <span class="bad">fail on base</span> by assertion', 11400],
  ['  <span class="warn">✎ meanwhile you edit app/storage.py in your checkout</span>', 12200],
  ['<span class="dotp">⏺</span> <b>statecraft-auditor-subagent</b> <span class="dim">diff-review · 1,206 fault scenarios, base vs branch</span>', 13000],
  [D + '<span class="bad">✗</span> a database error in the last write changes run_once\'s outcome', 14200],
  ['<span class="dotp">⏺</span> SendMessage <span class="dim">→ converter</span>', 15000],
  [D + '<span class="k">c8c0e5c</span> keep run_once\'s outcome · re-reviewed <span class="ok">✓</span>', 15700],
  ['<span class="dot">⏺</span> Landed 3 commits on <span class="k">statecraft-20261116-1231</span> · <span class="ok">45 tests OK</span>', 16700],
  [D + 'worktrees removed · nothing pushed', 17200],
  ['', 17500],
  ['  <span class="hd">Your checkout</span>  untouched, your edit kept · merge offered once you commit it', 17900],
  ['  <span class="hd">Fixed</span>          retries never ran · mail error marked "failed" · double claim', 18600],
  ['  <span class="hd">Asks</span>           failed vs queued between retries · rollout order · old stuck rows', 19300],
];
$('#log').innerHTML = lines.map(([h]) => `<span class="ln">${h}</span>`).join('');

function render(t) {
  const els = $$('#log .ln');
  lines.forEach(([, at, kind, until], i) => {
    const el = els[i];
    const shown = t >= at && !(kind === 'spin' && t >= until);
    el.style.display = (kind === 'spin' && t >= until) ? 'none' : 'block';
    el.style.opacity = shown ? out3(prog(t, at, 250)) : 0;
    if (kind === 'spin' && shown) {
      const frames = ['✻', '✶', '✳', '✢', '·', '✢', '✳', '✶'];
      el.firstChild.textContent = el.firstChild.textContent.replace(/^ {2}./, '  ' + frames[Math.floor(t / 120) % frames.length]);
    }
  });
  const p = $('#prompt');
  const done = typed(p, PROMPT, t, 200, 26);
  p.innerHTML = p.textContent + (t < 3600 && Math.floor(t / 450) % 2 === 0 ? '<span style="background:#e6edf3">&nbsp;</span>' : '');
}
</script>
</body>
</html>
